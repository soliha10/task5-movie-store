          - "#{full}"
          - "#{full}"
          - "#{full}"
          - "#{full}"
          - "#{np}"
          - "#{np}"
          - "#{np}"
          - "#{np}"
          - "#{np} #{place}"
          - "#{np} #{place}"
          - "#{np}: #{subtitle}"
          - "#{full}: #{subtitle}"
          - "#{full} #{sequel}"
          - "#{np} #{sequel}"
          - "#{noun}"
          - "#{noun}"
          - "#{noun} #{place}"
          - "#{noun}: #{subtitle}"
          - "#{noun} #{place_suffix}"
          - "#{np} #{place_suffix}"
