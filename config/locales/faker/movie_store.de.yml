de:
  faker:
    movie_store:
      genres:
        action: Action
        adventure: Abenteuer
        comedy: Komödie
        crime: Krimi
        drama: Drama
        family: Familie
        fantasy: Fantasy
        horror: Horror
        romance: Liebesfilm
        sci_fi: Science-Fiction
        thriller: Thriller
        western: Western

      # Namensmuster für Schauspieler und Regie. Name.* ruft Faker::Name im aktuellen Locale auf.
      person:
        - "#{Name.first_name} #{Name.last_name}"
        - "#{Name.first_name} #{Name.last_name}"
        - "#{Name.first_name} #{Name.last_name}"
        - "#{Name.first_name} #{Name.last_name}"
        - "#{Name.first_name} #{Name.last_name}"
        - "#{Name.first_name} #{Name.last_name}"
        - "#{Name.first_name} #{initial}. #{Name.last_name}"
        - "#{Name.first_name} von #{Name.last_name}"
        - "#{Name.first_name} #{Name.last_name}-#{Name.last_name}"
        - "#{Name.first_name} #{Name.first_name} #{Name.last_name}"
      stage_name:
        - "DJ #{Name.last_name}"
        - "MC #{Name.first_name}"
        - "Graf #{Name.last_name}"
        - "Herr #{Name.last_name}"
        - "Frau #{Name.last_name}"
        - "Dr. #{Name.last_name}"
        - "Die kleine #{Name.last_name}"
