      plot:
        by_genre:
          action:
            setup:
              - "When a routine extraction goes wrong, ex-commando #{hero} is left for dead in a foreign city."
              - "Retired agent #{hero} is pulled back into the game after a mysterious package arrives at the door."
              - "A disgraced pilot named #{hero} is the only one who can stop a hijacked cargo jet over #{city}."
              - "#{hero} has twelve hours to deliver a witness across #{city} while every gun in town is aimed at them."
              - "After a heist turns into a massacre, getaway driver #{hero} becomes the most wanted person alive."
              - "An off-duty firefighter, #{hero}, is trapped inside a skyscraper taken over by mercenaries."
            twist:
              - "The people giving the orders may be the real enemy."
              - "Every ally #{hero} trusts turns out to have a price."
              - "Now the only way out is straight through #{rival}'s private army."
              - "But the bomb is only the beginning."
              - "And the clock is already ticking."
          adventure:
            setup:
              - "A young cartographer named #{hero} discovers a map that should not exist."
              - "Treasure hunter #{hero} leads a reckless crew into an uncharted jungle."
              - "When a ship vanishes in the northern sea, #{hero} sets out to find the only survivor."
              - "#{hero} inherits a crumbling lighthouse and a key to a door no one has ever opened."
              - "A disgraced archaeologist, #{hero}, gets one last chance to find the lost temple of the sun."
            twist:
              - "But someone has been following them since the very first step."
              - "The further they go, the less the map looks like the world they know."
              - "Their greatest rival, #{rival}, is already one step ahead."
              - "And the treasure comes with a curse that never forgets."
          comedy:
            setup:
              - "Two best friends accidentally book the same wedding venue on the same day."
              - "#{hero} lies on a resume and somehow becomes CEO of a tech startup in #{city}."
              - "A family road trip to #{city} turns into a disaster when grandma steals the car."
              - "Broke and desperate, #{hero} agrees to fake-date a famous reality TV star."
              - "#{hero} wakes up after a bachelor party with a llama, a ring and no memory."
              - "An overworked dad, #{hero}, signs up for a cooking contest he has no chance of winning."
            twist:
              - "What could possibly go wrong?"
              - "Things escalate quickly when #{rival} moves in next door."
              - "The only problem: nobody can know the truth until Friday."
              - "Chaos, of course, ensues."
              - "Now they have one weekend to fix everything before anyone notices."
          crime:
            setup:
              - "A small-time bookkeeper, #{hero}, stumbles on a ledger that could bring down the mob in #{city}."
              - "Detective #{hero} returns to #{city} to investigate the murder of an old partner."
              - "Four strangers plan the perfect bank job on the night of the biggest storm in years."
              - "When a priceless painting disappears, insurance investigator #{hero} suspects everyone."
              - "An honest cop, #{hero}, goes undercover inside the family business of #{rival}."
            twist:
              - "But in this town, every witness has a price."
              - "The deeper #{hero} digs, the closer the trail leads back home."
              - "One of them is already working for the police."
              - "And the money was never the real prize."
          drama:
            setup:
              - "After years apart, a mother and daughter are forced to reunite when tragedy strikes their family."
              - "A retired teacher, #{hero}, receives a letter from a student she has not seen in thirty years."
              - "Following the death of their father, three siblings return to the family farm outside #{city}."
              - "A young pianist from #{city} gets one chance to audition for the conservatory of her dreams."
              - "#{hero} spends one last summer in the town where everything once fell apart."
              - "A widowed fisherman, #{hero}, takes in a runaway who reminds him of his late son."
            twist:
              - "Old secrets resurface, tearing them apart just when they need each other most."
              - "Now they must find the courage to forgive before it's too late."
              - "But some promises are harder to keep than to make."
              - "What they discover will change everything they believed about home."
          family:
            setup:
              - "A curious girl named #{hero} finds a tiny dragon living in her grandmother's garden."
              - "When the town's Christmas lights go out, three kids decide to save the holidays."
              - "#{hero} and his talking dog set off to find the world's biggest pancake."
              - "A clumsy robot escapes from a toy factory and moves into a family's treehouse."
              - "The new kid in #{city}, #{hero}, discovers that the school janitor is secretly a wizard."
            twist:
              - "Together they learn that friendship is the greatest magic of all."
              - "But keeping such a big secret is harder than it sounds."
              - "Now they have to get home before the grown-ups find out."
              - "It is going to be the best summer ever."
          fantasy:
            setup:
              - "In a kingdom ruled by fear, a stable girl named #{hero} discovers she can speak with dragons."
              - "The last of the moon-witches, #{hero}, must protect a stolen crown from an ancient order."
              - "When the northern gate falls, an exiled prince returns to reclaim a broken throne."
              - "A thief named #{hero} steals a sword that remembers every hand that ever held it."
              - "Every hundred years the stars fall over the valley, and this year #{hero} is chosen."
            twist:
              - "But the prophecy hides a darker truth."
              - "To win the war, #{hero} must make a pact with #{rival}, the very enemy they swore to destroy."
              - "And the shadow in the forest is waking up."
              - "Magic always comes with a price."
          horror:
            setup:
              - "A family moves into a farmhouse outside #{city}, unaware of what sleeps beneath the floorboards."
              - "Five friends rent a cabin in the woods for one quiet weekend."
              - "Night nurse #{hero} begins to hear children singing in the closed wing of the hospital."
              - "After her sister disappears, #{hero} follows a trail of old cassette tapes into the forest."
              - "A paranormal investigator, #{hero}, agrees to spend one night in the most haunted house in #{city}."
              - "Every night at 3:33, the old doll in the attic changes position."
            twist:
              - "Something is waiting for them in the dark."
              - "By the time they realize it, it is already inside."
              - "No one who has heard the lullaby has lived to tell."
              - "And it remembers every name."
              - "The only rule: never answer when it knocks."
          romance:
            setup:
              - "A burned-out architect, #{hero}, falls for a street musician during a rainy week in #{city}."
              - "Two strangers keep missing each other at the same café every morning."
              - "#{hero} returns home for her sister's wedding and runs straight into her first love."
              - "A wedding planner who no longer believes in love is hired by her ex-fiancé."
              - "A cynical food critic and a small-town baker are forced to share a tiny apartment in #{city}."
            twist:
              - "Love was never part of the plan."
              - "But the past has a way of catching up."
              - "They have ten days to decide if this is forever."
              - "Sometimes the right person arrives at the wrong time."
          sci_fi:
            setup:
              - "In 2147, a deep-space mining crew receives a distress signal from a ship that vanished a century ago."
              - "An engineer named #{hero} wakes up from cryosleep forty years too early."
              - "When the machines that run #{city} start making their own decisions, one programmer notices first."
              - "The last colony on Mars loses contact with Earth on the day #{hero} is born."
              - "#{hero}, a clone with someone else's memories, starts dreaming of a life she never lived."
            twist:
              - "Humanity's last hope lies in a message no one can decode."
              - "The signal is not a warning. It is an invitation."
              - "Machines will rise, and #{hero} may be the only one who can stop them."
              - "But time is running out for everyone on board."
          thriller:
            setup:
              - "A night-shift radio host, #{hero}, receives a call from a listener who claims to be watching her."
              - "When her husband vanishes on their anniversary, #{hero} finds a second passport in his drawer."
              - "A juror, #{hero}, becomes convinced that the defendant is innocent and the judge is lying."
              - "A data analyst stumbles on a file that proves a series of accidents in #{city} were murders."
              - "On a sleeper train across Europe, a passenger disappears and no one admits she was ever there."
            twist:
              - "Trust no one. Not even yourself."
              - "Every answer only makes the truth more dangerous."
              - "The killer is closer than anyone thinks."
              - "And #{rival} knows exactly what they did last winter."
          western:
            setup:
              - "A lone gunslinger rides into a dying silver town with a bounty sewn into his coat."
              - "After her family's ranch is burned, #{hero} hunts the outlaws across three territories."
              - "An aging sheriff, #{hero}, has one week left before retirement and one man left to hang."
              - "A stagecoach carrying gold, a preacher and a murderer gets lost in the desert."
              - "Two estranged brothers drive a herd of cattle through Comanche land."
            twist:
              - "In this land, justice is measured in bullets."
              - "But #{rival} and his gang are already waiting at the river."
              - "Only one of them will ride back home."
              - "And the desert keeps every secret."

