      plot:
        by_genre:
          action:
            setup:
              - "Після провальної операції #{hero} залишається сам на сам із ворожим містом."
              - "#{hero} отримує загадкову посилку і розуміє, що спокійне життя скінчилося."
              - "Лише #{hero} може посадити захоплений вантажний літак над містом #{city}."
              - "За дванадцять годин #{hero} має провезти свідка через усе місто #{city}, а за ними полює кожен найманець."
              - "Пограбування перетворюється на бійню, і тепер #{hero} — найрозшукуваніша людина в країні."
              - "Хмарочос у місті #{city} захоплюють найманці, а всередині випадково опиняється #{hero}."
            twist:
              - "Але справжній ворог може сидіти просто в штабі."
              - "Кожен союзник має свою ціну."
              - "Тепер єдиний вихід — крізь приватну армію, яку очолює #{rival}."
              - "Та бомба — це лише початок."
              - "І годинник уже цокає."
          adventure:
            setup:
              - "#{hero} знаходить мапу, якої не повинно існувати."
              - "Шукачі скарбів вирушають у неходжені джунглі, і веде їх #{hero}."
              - "Коли в Північному морі безслідно зникає корабель, #{hero} вирушає на пошуки єдиного вцілілого."
              - "#{hero} отримує в спадок старий маяк і ключ від дверей, які ніхто ніколи не відчиняв."
              - "Експедиція з міста #{city} шукає загублений храм Сонця, і для неї це останній шанс."
            twist:
              - "Але хтось іде за ними від самого першого кроку."
              - "Що далі вони йдуть, то менше мапа схожа на знайомий світ."
              - "А головний суперник, #{rival}, уже на крок попереду."
              - "І скарб охороняє прокляття, яке нічого не забуває."
          comedy:
            setup:
              - "Дві найкращі подруги випадково бронюють одну й ту саму залу для весілля на той самий день."
              - "#{hero} трохи прикрашає резюме і несподівано очолює айті-стартап у місті #{city}."
              - "Сімейна подорож до міста #{city} перетворюється на катастрофу, коли бабуся викрадає машину."
              - "Без грошей і без вибору #{hero} погоджується на фіктивні стосунки із зіркою реаліті-шоу."
              - "#{hero} прокидається після шаленої вечірки з ламою, обручкою і повною амнезією."
              - "#{hero} записується на кулінарне шоу, хоча не вміє зварити навіть яйце."
            twist:
              - "Що може піти не так?"
              - "Усе стає ще гірше, коли по сусідству оселяється #{rival}."
              - "Єдина проблема: до п'ятниці ніхто не повинен знати правди."
              - "Звісно, починається повний хаос."
              - "Тепер у них є лише одні вихідні, щоб усе виправити."
          crime:
            setup:
              - "#{hero} випадково знаходить бухгалтерську книгу, яка може знищити мафію в місті #{city}."
              - "#{hero} повертається до міста #{city}, щоб розслідувати вбивство колишнього напарника."
              - "Четверо незнайомців планують ідеальне пограбування банку в ніч найсильнішої бурі за багато років."
              - "Із музею зникає безцінна картина, і #{hero} підозрює абсолютно всіх."
              - "#{hero} під прикриттям проникає в сімейний бізнес, яким керує #{rival}."
            twist:
              - "Але в цьому місті кожен свідок має свою ціну."
              - "Що глибше копає #{hero}, то ближче слід веде додому."
              - "Один із них уже давно працює на поліцію."
              - "І гроші ніколи не були справжньою метою."
          drama:
            setup:
              - "Після багатьох років розлуки мати й донька змушені знову жити під одним дахом, коли в родину приходить біда."
              - "Через тридцять років після останнього уроку #{hero} отримує лист від колишнього учня."
              - "Після смерті батька троє дорослих дітей повертаються на родинну ферму під містом #{city}."
              - "Юна піаністка з міста #{city} отримує єдиний шанс вступити до консерваторії своєї мрії."
              - "#{hero} проводить останнє літо в містечку, де колись усе розвалилося."
              - "У маленькому рибальському селищі #{hero} дає притулок підліткові, що втік з дому."
            twist:
              - "Старі таємниці спливають саме тоді, коли вони найбільше потрібні одне одному."
              - "Тепер їм треба знайти сили пробачити, поки не пізно."
              - "Але деякі обіцянки важче дотримати, ніж дати."
              - "Те, що вони дізнаються, змінить усе, у що вони вірили."
          family:
            setup:
              - "#{hero} знаходить у бабусиному саду крихітного дракона."
              - "Коли в місті гаснуть різдвяні вогні, троє дітлахів вирішують урятувати свято."
              - "#{hero} і балакучий пес вирушають на пошуки найбільшого у світі млинця."
              - "Незграбний робот тікає з фабрики іграшок і оселяється в хатинці на дереві."
              - "Переїхавши до міста #{city}, #{hero} дізнається, що шкільний сторож — справжній чарівник."
            twist:
              - "Разом вони дізнаються, що дружба — найсильніша магія."
              - "Але зберегти таку велику таємницю не так просто."
              - "Тепер треба встигнути додому, поки дорослі нічого не помітили."
              - "Це буде найкраще літо в житті!"
          fantasy:
            setup:
              - "У королівстві, де панує страх, #{hero} дізнається, що вміє розмовляти з драконами."
              - "Древній орден полює за викраденою короною, і захистити її може лише #{hero}."
              - "Коли падає Північна брама, вигнаний принц повертається, щоб відвоювати зламаний трон."
              - "#{hero} краде меч, який пам'ятає кожну руку, що його тримала."
              - "Раз на сто років над долиною падають зорі, а з ними приходить вибір. Цього разу це #{hero}."
            twist:
              - "Але пророцтво приховує темнішу правду."
              - "Щоб перемогти у війні, доведеться укласти союз із ворогом, якого звуть #{rival}."
              - "А тінь у лісі вже прокидається."
              - "Магія завжди має свою ціну."
